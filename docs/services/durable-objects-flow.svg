<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 520" role="img" aria-labelledby="doFlowTitle doFlowDesc">
  <title id="doFlowTitle">One name reaches one cell, and one node owns that cell</title>
  <desc id="doFlowDesc">Workers on node A and node B both address the name room-7,
and a Worker on node C addresses the name room-8. getByName turns each name into
one 64-digit hexadecimal id, the owner record in the fleet bucket names one
owner node for each cell, and celld forwards the call to that node. The room-7
cell has owner node B and epoch e7, and the room-8 cell has owner node C and
epoch e3, so ownership belongs to a cell and not to a class. Each cell runs one
event at a time. The room-7 cell keeps its own SQLite database on node B. Node B
sends each write to a follower node, whose fsync releases the answer, and the
write then uploads to the fleet bucket under cells/room-7/ltx/e7/. The previous
prefix, cells/room-7/ltx/e6/, is superseded, so a node that lost the cell cannot
damage the current data. Node C keeps the room-8 cell the same way, under its
own epoch.</desc>
  <style>
    .d-ink { color: #121212 }
    .d-soft { color: #3d3b37 }
    .d-faint { color: #6e6a62 }
    .d-acc { color: #10803f }
    .d-panel { color: #ffffff }
    .d-sunk { color: #f0eee8 }
    .d-tint { color: #d6efdf }
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      fill: currentColor;
    }
    @media (prefers-color-scheme: dark) {
      .d-ink { color: #efede7 }
      .d-soft { color: #c9c6be }
      .d-faint { color: #928e85 }
      .d-acc { color: #3fc472 }
      .d-panel { color: #1a1a19 }
      .d-sunk { color: #232321 }
      .d-tint { color: #10301d }
    }
  </style>
  <defs>
    <marker id="do-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
      markerHeight="6" orient="auto-start-reverse">
      <path class="d-soft" fill="currentColor" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>

  <!-- Callers: three nodes, two of them addressing one name. -->
  <rect class="d-panel" fill="currentColor" x="6" y="8" width="136" height="48" rx="6" />
  <rect class="d-soft" fill="none" stroke="currentColor" x="6" y="8" width="136" height="48" rx="6" />
  <text class="d-ink" fill="currentColor" x="74" y="29" text-anchor="middle">Worker · node A</text>
  <text class="d-soft" fill="currentColor" x="74" y="46" text-anchor="middle">name: "room-7"</text>

  <rect class="d-panel" fill="currentColor" x="152" y="8" width="136" height="48" rx="6" />
  <rect class="d-soft" fill="none" stroke="currentColor" x="152" y="8" width="136" height="48" rx="6" />
  <text class="d-ink" fill="currentColor" x="220" y="29" text-anchor="middle">Worker · node B</text>
  <text class="d-soft" fill="currentColor" x="220" y="46" text-anchor="middle">name: "room-7"</text>

  <rect class="d-panel" fill="currentColor" x="298" y="8" width="136" height="48" rx="6" />
  <rect class="d-soft" fill="none" stroke="currentColor" x="298" y="8" width="136" height="48" rx="6" />
  <text class="d-ink" fill="currentColor" x="366" y="29" text-anchor="middle">Worker · node C</text>
  <text class="d-soft" fill="currentColor" x="366" y="46" text-anchor="middle">name: "room-8"</text>

  <!-- The boundary each call crosses: name to id, owner record, forward. -->
  <rect class="d-faint" fill="none" stroke="currentColor" stroke-dasharray="5 4"
    x="6" y="72" width="428" height="62" rx="6" />
  <text class="d-faint" fill="currentColor" x="220" y="92" text-anchor="middle">getByName() gives one 64-hex id</text>
  <text class="d-faint" fill="currentColor" x="220" y="111" text-anchor="middle">the owner record in the bucket names one node</text>
  <text class="d-faint" fill="currentColor" x="220" y="130" text-anchor="middle">celld forwards the call to that node</text>

  <!-- Two callers of one name join. A second name is a second cell. -->
  <g class="d-soft" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M74 56 V66" />
    <path d="M220 56 V66" />
    <path d="M60 66 H220" />
    <path d="M60 66 V152" marker-end="url(#do-arrow)" />
    <path d="M366 56 V66 H380 V152" marker-end="url(#do-arrow)" />
  </g>

  <!-- One cell, one owner, one event. Ownership belongs to a cell, not a class. -->
  <rect class="d-tint" fill="currentColor" x="16" y="156" width="200" height="90" rx="6" />
  <rect class="d-acc" fill="none" stroke="currentColor" stroke-width="2" x="16" y="156" width="200" height="90" rx="6" />
  <text class="d-ink" fill="currentColor" x="116" y="177" text-anchor="middle">room-7 cell</text>
  <text class="d-soft" fill="currentColor" x="116" y="196" text-anchor="middle">owner: node B</text>
  <text class="d-soft" fill="currentColor" x="116" y="215" text-anchor="middle">one event at a time</text>
  <text class="d-faint" fill="currentColor" x="116" y="234" text-anchor="middle">epoch e7</text>

  <rect class="d-tint" fill="currentColor" x="224" y="156" width="200" height="90" rx="6" />
  <rect class="d-acc" fill="none" stroke="currentColor" stroke-width="2" x="224" y="156" width="200" height="90" rx="6" />
  <text class="d-ink" fill="currentColor" x="324" y="177" text-anchor="middle">room-8 cell</text>
  <text class="d-soft" fill="currentColor" x="324" y="196" text-anchor="middle">owner: node C</text>
  <text class="d-soft" fill="currentColor" x="324" y="215" text-anchor="middle">one event at a time</text>
  <text class="d-faint" fill="currentColor" x="324" y="234" text-anchor="middle">epoch e3</text>

  <!-- The owner holds the database, and the write then buys its durability. -->
  <g class="d-soft" fill="none" stroke="currentColor" stroke-width="1.5">
    <path d="M116 246 V272" marker-end="url(#do-arrow)" />
    <path d="M116 322 V346" marker-end="url(#do-arrow)" />
    <path d="M116 396 V420" marker-end="url(#do-arrow)" />
  </g>

  <rect class="d-sunk" fill="currentColor" x="16" y="276" width="200" height="46" rx="6" />
  <rect class="d-soft" fill="none" stroke="currentColor" x="16" y="276" width="200" height="46" rx="6" />
  <text class="d-ink" fill="currentColor" x="116" y="297" text-anchor="middle">SQLite on node B</text>
  <text class="d-soft" fill="currentColor" x="116" y="314" text-anchor="middle">one database per cell</text>

  <rect class="d-sunk" fill="currentColor" x="16" y="350" width="200" height="46" rx="6" />
  <rect class="d-soft" fill="none" stroke="currentColor" x="16" y="350" width="200" height="46" rx="6" />
  <text class="d-ink" fill="currentColor" x="116" y="371" text-anchor="middle">a follower node</text>
  <text class="d-soft" fill="currentColor" x="116" y="388" text-anchor="middle">fsync frees the answer</text>

  <text class="d-faint" fill="currentColor" x="326" y="297" text-anchor="middle">node C keeps room-8</text>
  <text class="d-faint" fill="currentColor" x="326" y="316" text-anchor="middle">the same way, under</text>
  <text class="d-faint" fill="currentColor" x="326" y="335" text-anchor="middle">its own epoch</text>

  <!-- The epoch in the prefix is the fence. -->
  <rect class="d-sunk" fill="currentColor" x="6" y="424" width="428" height="90" rx="6" />
  <rect class="d-soft" fill="none" stroke="currentColor" x="6" y="424" width="428" height="90" rx="6" />
  <text class="d-ink" fill="currentColor" x="220" y="444" text-anchor="middle">fleet bucket · the long-term copy</text>

  <rect class="d-tint" fill="currentColor" x="18" y="454" width="200" height="48" rx="6" />
  <rect class="d-acc" fill="none" stroke="currentColor" stroke-width="2" x="18" y="454" width="200" height="48" rx="6" />
  <text class="d-ink" fill="currentColor" x="118" y="474" text-anchor="middle">cells/room-7/ltx/e7/</text>
  <text class="d-soft" fill="currentColor" x="118" y="492" text-anchor="middle">this owner writes here</text>

  <rect class="d-faint" fill="none" stroke="currentColor" stroke-dasharray="5 4"
    x="222" y="454" width="200" height="48" rx="6" />
  <text class="d-faint" fill="currentColor" x="322" y="474" text-anchor="middle">cells/room-7/ltx/e6/</text>
  <text class="d-faint" fill="currentColor" x="322" y="492" text-anchor="middle">an old owner is fenced</text>
</svg>
